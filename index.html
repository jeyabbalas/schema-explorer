<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Schema Explorer — compare data dictionaries across cohorts</title>
    <meta
      name="description"
      content="Explore and search several JSON Schema data dictionaries at once, entirely in your browser."
    />
    <script>
      // Apply the saved or system theme before the first paint so the page never flashes.
      try {
        var t = localStorage.getItem("schema-explorer:theme");
        document.documentElement.dataset.theme =
          t === "light" || t === "dark"
            ? t
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      } catch (e) {
        /* storage unavailable: CSS falls back to prefers-color-scheme */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
