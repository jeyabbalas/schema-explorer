name: CI and deploy to GitHub Pages

# Every push to main and every pull request runs the full quality gate (typecheck, lint,
# format check, tests, production build). Pushes to main additionally publish dist/ to
# GitHub Pages. One-time setup: Settings → Pages → Build and deployment → Source = "GitHub Actions"
# (or: gh api -X POST repos/jeyabbalas/schema-explorer/pages -f build_type=workflow).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never cancel an in-flight production deployment; do cancel superseded PR runs.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck, lint, format check, test, build
        run: npm run check

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
